[project]
name = "claude-code-obd-reader"
version = "0.1.0"
description = "Read a car's engine computer over a USB OBD-II adapter, read-only"
requires-python = ">=3.11"
dependencies = ["obd>=0.7.2"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
